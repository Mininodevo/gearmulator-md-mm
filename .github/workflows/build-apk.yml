name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find the app and put it in source/Android
        run: |
          F=$(find . -name mdmm_jni.cpp -not -path "./source/3rdparty/*" | head -n 1)
          if [ -z "$F" ]; then
            echo "ERRO: mdmm_jni.cpp nao foi encontrado. Arquivos enviados:"
            find . -maxdepth 4 -not -path './.git/*' -not -path './source/3rdparty/*' -not -path './source/cpu/*' | head -150
            exit 1
          fi
          echo "Encontrado em: $F"
          APPDIR=$(cd "$(dirname "$F")/../../.." && pwd)
          echo "Pasta do modulo: $APPDIR"
          if [ "$APPDIR" = "$(pwd)" ]; then
            echo "ERRO: os arquivos do app foram enviados soltos na raiz. Mande o print da lista de arquivos."
            exit 1
